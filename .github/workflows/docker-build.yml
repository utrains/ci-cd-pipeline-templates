name: Container · Build, scan & push

# Reusable workflow: build a container image with BuildKit, scan it with Trivy BEFORE it is pushed,
# push it to ECR / GHCR / Docker Hub / any registry, attach SBOM + SLSA provenance, and
# optionally sign it keylessly with cosign.
# Docs: docs/workflows/docker-build.md

on:
  workflow_call:
    inputs:
      image_name:
        description: Repository name without registry or tag, e.g. "payments/api" (for GHCR use "<owner>/<name>").
        type: string
        required: true
      registry:
        description: "ecr | ghcr | dockerhub | custom"
        type: string
        default: ecr
      registry_host:
        description: Registry hostname when registry=custom (e.g. registry.example.com).
        type: string
        default: ""
      aws_region:
        description: AWS region.
        type: string
        default: us-east-1
      dockerfile:
        description: Path to the Dockerfile.
        type: string
        default: ./Dockerfile
      context:
        description: Docker build context.
        type: string
        default: "."
      target:
        description: Multi-stage build target.
        type: string
        default: ""
      build_args:
        description: Newline-separated KEY=VALUE build arguments.
        type: string
        default: ""
      platforms:
        description: Comma-separated target platforms, e.g. linux/amd64,linux/arm64.
        type: string
        default: linux/amd64
      tags:
        description: docker/metadata-action tag rules (newline-separated).
        type: string
        default: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,format=long
      push:
        description: Push the image. Set to false on pull requests to only build (and scan).
        type: boolean
        default: true
      scan_image:
        description: Scan the image with Trivy before pushing; the push is blocked on findings.
        type: boolean
        default: true
      scan_severity:
        description: Severities that block the push.
        type: string
        default: CRITICAL,HIGH
      sbom:
        description: Attach an SBOM attestation.
        type: boolean
        default: true
      provenance:
        description: Attach SLSA provenance (mode=max).
        type: boolean
        default: true
      sign:
        description: Sign the pushed image with cosign keyless (Sigstore / GitHub OIDC).
        type: boolean
        default: false
      runs_on:
        description: Runner label, or a JSON array of labels.
        type: string
        default: ubuntu-latest
      timeout_minutes:
        description: Job timeout in minutes.
        type: number
        default: 45
    secrets:
      aws_role:
        description: IAM role ARN to assume via OIDC (registry=ecr).
        required: false
      registry_username:
        description: Username for dockerhub / custom registries.
        required: false
      registry_password:
        description: Password / token for dockerhub / custom registries (optional for ghcr; defaults to GITHUB_TOKEN).
        required: false
      build_secrets:
        description: Newline-separated id=value BuildKit secrets (mounted with RUN --mount=type=secret).
        required: false
    outputs:
      image:
        description: Fully qualified image repository (registry/name).
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: Image digest (sha256:...). Empty when push=false.
        value: ${{ jobs.build.outputs.digest }}
      image_ref:
        description: Immutable reference image@digest. Use this for deployments.
        value: ${{ jobs.build.outputs.image_ref }}
      version:
        description: Primary version tag computed by docker/metadata-action.
        value: ${{ jobs.build.outputs.version }}
      tags:
        description: All tags that were applied (newline-separated).
        value: ${{ jobs.build.outputs.tags }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.image_name }}
    runs-on: ${{ startsWith(inputs.runs_on, '[') && fromJSON(inputs.runs_on) || inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
      id-token: write  # AWS OIDC + cosign keyless signing
      packages: write  # GHCR push
    outputs:
      image: ${{ steps.registry.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
      image_ref: ${{ steps.push.outputs.digest != '' && format('{0}@{1}', steps.registry.outputs.image, steps.push.outputs.digest) || '' }}
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        if: inputs.registry == 'ecr'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ secrets.aws_role }}

      - name: Login to Amazon ECR
        id: ecr
        if: inputs.registry == 'ecr'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Resolve registry
        id: registry
        env:
          REGISTRY: ${{ inputs.registry }}
          CUSTOM_HOST: ${{ inputs.registry_host }}
          ECR_HOST: ${{ steps.ecr.outputs.registry }}
          IMAGE_NAME: ${{ inputs.image_name }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          case "$REGISTRY" in
            ecr)       host="$ECR_HOST" ;;
            ghcr)      host="ghcr.io" ;;
            dockerhub) host="docker.io" ;;
            custom)    host="$CUSTOM_HOST" ;;
            *) echo "::error::Unsupported registry '$REGISTRY'"; exit 1 ;;
          esac
          if [ -z "$host" ]; then echo "::error::Registry host could not be resolved"; exit 1; fi
          image="${host}/$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          {
            echo "host=$host"
            echo "image=$image"
            echo "first_platform=${PLATFORMS%%,*}"
          } >> "$GITHUB_OUTPUT"

      - name: Login to registry
        if: inputs.registry != 'ecr'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ inputs.registry == 'ghcr' && github.actor || secrets.registry_username }}
          password: ${{ inputs.registry == 'ghcr' && (secrets.registry_password || github.token) || secrets.registry_password }}

      - name: Set up QEMU
        if: inputs.platforms != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.registry.outputs.image }}
          tags: ${{ inputs.tags }}

      # Build a single-platform copy into the local daemon so it can be scanned before anything is pushed.
      - name: Build for scan
        if: inputs.scan_image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build_args }}
          secrets: ${{ secrets.build_secrets }}
          platforms: ${{ steps.registry.outputs.first_platform }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: local-scan/${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.image_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}

      - name: Trivy scan (blocks push on findings)
        if: inputs.scan_image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: local-scan/${{ github.sha }}
          severity: ${{ inputs.scan_severity }}
          ignore-unfixed: true
          trivyignores: ${{ hashFiles('.trivyignore') != '' && '.trivyignore' || '' }}
          format: table
          exit-code: "1"

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build_args }}
          secrets: ${{ secrets.build_secrets }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: ${{ inputs.push && inputs.sbom }}
          provenance: ${{ inputs.push && inputs.provenance && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=${{ inputs.image_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}

      - name: Install cosign
        if: inputs.sign && inputs.push
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        if: inputs.sign && inputs.push
        env:
          REF: ${{ steps.registry.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Summary
        env:
          IMAGE: ${{ steps.registry.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          PUSHED: ${{ inputs.push }}
        run: |
          {
            echo "### Container image"
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$IMAGE\` |"
            echo "| Pushed | $PUSHED |"
            echo "| Digest | \`${DIGEST:-n/a}\` |"
            echo ""
            echo "**Tags**"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
