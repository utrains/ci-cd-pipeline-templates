name: Scan · Secrets (gitleaks)

# Reusable workflow: detect committed secrets with gitleaks.
# On pull requests only the PR's commits are scanned; on push only the pushed commits;
# otherwise (schedule / manual) the full history.
# Docs: docs/workflows/secret-scan.md

on:
  workflow_call:
    inputs:
      gitleaks_version:
        description: gitleaks release to install (without the leading v).
        type: string
        default: "8.30.1"
      config_path:
        description: Path to a .gitleaks.toml in the calling repository. Empty = gitleaks defaults (or .gitleaks.toml at the root, if present).
        type: string
        default: ""
      full_history:
        description: Always scan the full git history, regardless of the event.
        type: boolean
        default: false
      upload_sarif:
        description: Upload findings to GitHub code scanning (needs security-events write).
        type: boolean
        default: true
      runs_on:
        description: Runner label, or a JSON array of labels.
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ${{ startsWith(inputs.runs_on, '[') && fromJSON(inputs.runs_on) || inputs.runs_on }}
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        env:
          VERSION: ${{ inputs.gitleaks_version }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          tarball="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$tarball" checksums.txt gitleaks
          gitleaks version

      - name: Run gitleaks
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full_history }}
          CONFIG: ${{ inputs.config_path }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          args=(git --redact --no-banner --exit-code 1 --report-format sarif --report-path gitleaks.sarif)
          if [ -n "$CONFIG" ]; then args+=(--config "$CONFIG"); fi
          if [ "$FULL" != "true" ]; then
            if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "pull_request_target" ]; then
              args+=(--log-opts "${PR_BASE}..${PR_HEAD}")
            elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
              args+=(--log-opts "${PUSH_BEFORE}..${PUSH_AFTER}")
            fi
          fi
          gitleaks "${args[@]}" .

      - name: Upload SARIF
        if: always() && inputs.upload_sarif && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
