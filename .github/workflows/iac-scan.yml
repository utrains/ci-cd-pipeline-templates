name: Scan · IaC (Checkov)

# Reusable workflow: policy-as-code scanning of Terraform, CloudFormation, Kubernetes, Helm,
# Dockerfiles and GitHub Actions with Checkov.
# Docs: docs/workflows/iac-scan.md

on:
  workflow_call:
    inputs:
      directory:
        description: Directory to scan.
        type: string
        default: "."
      framework:
        description: Comma-separated frameworks (terraform, kubernetes, helm, dockerfile, cloudformation, github_actions, ...). Empty = all.
        type: string
        default: ""
      skip_check:
        description: Comma-separated check IDs to skip (e.g. CKV_AWS_18,CKV_AWS_144).
        type: string
        default: ""
      config_file:
        description: Path to a .checkov.yaml config file.
        type: string
        default: ""
      soft_fail:
        description: Report findings without failing the job.
        type: boolean
        default: false
      download_external_modules:
        description: Download external Terraform modules before scanning.
        type: boolean
        default: true
      upload_sarif:
        description: Upload findings to GitHub code scanning (needs security-events write).
        type: boolean
        default: true
      runs_on:
        description: Runner label, or a JSON array of labels.
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov IaC scan
    runs-on: ${{ startsWith(inputs.runs_on, '[') && fromJSON(inputs.runs_on) || inputs.runs_on }}
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # v12.3139.0
        with:
          directory: ${{ inputs.directory }}
          framework: ${{ inputs.framework }}
          skip_check: ${{ inputs.skip_check }}
          config_file: ${{ inputs.config_file }}
          soft_fail: ${{ inputs.soft_fail }}
          download_external_modules: ${{ inputs.download_external_modules }}
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif

      - name: Upload SARIF
        if: always() && inputs.upload_sarif && hashFiles('checkov-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: checkov-results.sarif
          category: checkov
