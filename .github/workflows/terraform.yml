name: Infra · Terraform

# Reusable workflow: fmt → init → validate → tflint → plan, with the plan posted to the PR.
# With action=apply, the exact saved plan is applied in a second job gated by a GitHub
# Environment (use required reviewers on that environment for manual approval).
# Docs: docs/workflows/terraform.md

on:
  workflow_call:
    inputs:
      action:
        description: "plan | apply"
        type: string
        default: plan
      tf_version:
        description: Terraform version; pin it to the version that manages your state.
        type: string
        default: "1.16.3"
      working_directory:
        description: Terraform root module directory.
        type: string
        default: "./"
      backend_config:
        description: Newline-separated -backend-config values (key=value) or a backend config file path.
        type: string
        default: ""
      var_file:
        description: Path to a .tfvars file, relative to working_directory.
        type: string
        default: ""
      workspace:
        description: Terraform workspace to select (created if missing).
        type: string
        default: ""
      run_tflint:
        description: Run TFLint.
        type: boolean
        default: true
      fmt_check:
        description: Fail when files are not formatted with `terraform fmt`.
        type: boolean
        default: true
      comment_on_pr:
        description: Post / update the plan as a pull-request comment.
        type: boolean
        default: true
      environment:
        description: GitHub Environment that gates the apply job (required when action=apply).
        type: string
        default: ""
      aws_region:
        description: AWS region.
        type: string
        default: us-east-1
      runs_on:
        description: Runner label, or a JSON array of labels.
        type: string
        default: ubuntu-latest
      timeout_minutes:
        description: Job timeout in minutes.
        type: number
        default: 60
    secrets:
      aws_role_to_assume:
        description: IAM role ARN to assume via OIDC. Omit for non-AWS providers.
        required: false
      tf_api_token:
        description: HCP Terraform / Terraform Enterprise API token (remote backend or private registry).
        required: false
    outputs:
      has_changes:
        description: "'true' when the plan contains changes."
        value: ${{ jobs.plan.outputs.has_changes }}

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: Terraform plan (${{ inputs.working_directory }})
    runs-on: ${{ startsWith(inputs.runs_on, '[') && fromJSON(inputs.runs_on) || inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      plan_artifact: ${{ steps.plan.outputs.artifact }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    env:
      AWS_ROLE: ${{ secrets.aws_role_to_assume }}
      BACKEND_CONFIG: ${{ inputs.backend_config }}
      VAR_FILE: ${{ inputs.var_file }}
      WORKSPACE: ${{ inputs.workspace }}
      WORKDIR: ${{ inputs.working_directory }}
    steps:
      - name: Validate inputs
        env:
          ACTION: ${{ inputs.action }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "$ACTION" in plan|apply) ;; *) echo "::error::action must be plan or apply"; exit 1 ;; esac
          if [ "$ACTION" = "apply" ] && [ -z "$ENVIRONMENT" ]; then
            echo "::error::'environment' is required when action=apply so the apply can be gated"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.tf_version }}
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.tf_api_token }}

      - name: Configure AWS credentials (OIDC)
        if: env.AWS_ROLE != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ env.AWS_ROLE }}

      - name: Terraform fmt
        if: inputs.fmt_check
        run: terraform fmt -check -recursive -diff

      - name: Terraform init
        run: |
          args=()
          while IFS= read -r line; do
            if [ -n "$line" ]; then args+=("-backend-config=$line"); fi
          done <<< "$BACKEND_CONFIG"
          terraform init "${args[@]}"
          if [ -n "$WORKSPACE" ]; then
            terraform workspace select -or-create "$WORKSPACE"
          fi

      - name: Terraform validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        if: inputs.run_tflint

      - name: TFLint
        if: inputs.run_tflint
        run: |
          tflint --init
          tflint --recursive --format compact

      - name: Terraform plan
        id: plan
        run: |
          args=(-out=tfplan -lock-timeout=5m -detailed-exitcode)
          if [ -n "$VAR_FILE" ]; then args+=("-var-file=$VAR_FILE"); fi
          set +e
          terraform plan "${args[@]}"
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then exit 1; fi
          if [ "$code" -eq 2 ]; then echo "has_changes=true" >> "$GITHUB_OUTPUT"; else echo "has_changes=false" >> "$GITHUB_OUTPUT"; fi
          terraform show -no-color tfplan > plan.txt
          # Unique per directory + workspace so several Terraform roots can run in one pipeline.
          echo "artifact=tfplan-$(echo "${WORKDIR}-${WORKSPACE}" | tr -c 'A-Za-z0-9_-' '-')" >> "$GITHUB_OUTPUT"
          {
            echo "### Terraform plan — \`${WORKDIR}\`"
            echo '```'
            grep -E '^(Plan:|No changes\.|Changes to Outputs)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        if: inputs.comment_on_pr && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_FILE: ${{ inputs.working_directory }}/plan.txt
          WORKDIR: ${{ inputs.working_directory }}
        with:
          script: |
            const fs = require('fs');
            const marker = `<!-- terraform-plan:${process.env.WORKDIR} -->`;
            let plan = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            const max = 60000;
            if (plan.length > max) plan = plan.slice(0, max) + '\n\n… truncated, see the workflow run for the full plan.';
            const summary = (plan.match(/^(Plan:.*|No changes\..*)$/m) || ['(see details)'])[0];
            const body = `${marker}
            #### Terraform plan — \`${process.env.WORKDIR}\`
            **${summary}**

            <details><summary>Show plan</summary>

            \`\`\`hcl
            ${plan}
            \`\`\`
            </details>

            _Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      # The plan file can contain sensitive values: keep retention short and restrict repo access.
      - name: Upload plan
        if: inputs.action == 'apply' && steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.plan.outputs.artifact }}
          path: ${{ inputs.working_directory }}/tfplan
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  apply:
    name: Terraform apply (${{ inputs.working_directory }})
    needs: plan
    if: inputs.action == 'apply' && needs.plan.outputs.has_changes == 'true'
    runs-on: ${{ startsWith(inputs.runs_on, '[') && fromJSON(inputs.runs_on) || inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: terraform-apply-${{ github.repository }}-${{ inputs.working_directory }}-${{ inputs.workspace }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    env:
      AWS_ROLE: ${{ secrets.aws_role_to_assume }}
      BACKEND_CONFIG: ${{ inputs.backend_config }}
      WORKSPACE: ${{ inputs.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.tf_version }}
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.tf_api_token }}

      - name: Configure AWS credentials (OIDC)
        if: env.AWS_ROLE != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ env.AWS_ROLE }}

      - name: Terraform init
        run: |
          args=()
          while IFS= read -r line; do
            if [ -n "$line" ]; then args+=("-backend-config=$line"); fi
          done <<< "$BACKEND_CONFIG"
          terraform init "${args[@]}"
          if [ -n "$WORKSPACE" ]; then
            terraform workspace select "$WORKSPACE"
          fi

      - name: Download plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.plan.outputs.plan_artifact }}
          path: ${{ inputs.working_directory }}

      # Applying the saved plan guarantees that exactly what was reviewed is what gets applied;
      # Terraform refuses the plan if the state changed in between.
      - name: Terraform apply
        run: terraform apply -auto-approve -lock-timeout=5m tfplan
