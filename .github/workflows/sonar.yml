name: Scan · SonarQube

# Reusable workflow: SonarQube / SonarCloud static analysis with an optional blocking quality gate.
# Docs: docs/workflows/sonar.md

on:
  workflow_call:
    inputs:
      sonar_host:
        description: SonarQube server URL (https://sonarcloud.io for SonarCloud).
        type: string
        required: true
      project_key:
        description: Sonar project key.
        type: string
        required: true
      project_name:
        description: Sonar project display name.
        type: string
        required: true
      organization:
        description: SonarCloud organization key. Leave empty for SonarQube Server.
        type: string
        default: ""
      quality_gate:
        description: Wait for the quality gate result and fail the job if it is not green.
        type: boolean
        default: true
      quality_gate_timeout:
        description: Seconds to wait for the quality gate.
        type: number
        default: 300
      working_directory:
        description: Project base directory for the scanner.
        type: string
        default: "."
      extra_args:
        description: Extra scanner arguments, e.g. "-Dsonar.sources=src -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info".
        type: string
        default: ""
      coverage_artifact:
        description: Name of an artifact (e.g. produced by a build workflow) to download into working_directory before scanning.
        type: string
        default: ""
      coverage_artifact_path:
        description: Where to extract coverage_artifact, relative to working_directory.
        type: string
        default: coverage
      runs_on:
        description: Runner label, or a JSON array of labels.
        type: string
        default: ubuntu-latest
      timeout_minutes:
        description: Job timeout in minutes.
        type: number
        default: 30
    secrets:
      sonar_token:
        description: Sonar analysis token.
        required: true

permissions:
  contents: read

jobs:
  sonar_scan:
    name: SonarQube analysis
    runs-on: ${{ startsWith(inputs.runs_on, '[') && fromJSON(inputs.runs_on) || inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for blame / new-code detection
          persist-credentials: false

      - name: Download coverage artifact
        if: inputs.coverage_artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.coverage_artifact }}
          path: ${{ inputs.working_directory }}/${{ inputs.coverage_artifact_path }}

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.sonar_token }}
          SONAR_HOST_URL: ${{ inputs.sonar_host }}
          # Passed as JSON so project names with spaces or quotes are safe.
          SONAR_SCANNER_JSON_PARAMS: >-
            ${{ format('{{"sonar.projectKey":{0},"sonar.projectName":{1},"sonar.qualitygate.wait":"{2}","sonar.qualitygate.timeout":"{3}"{4}}}',
                toJSON(inputs.project_key), toJSON(inputs.project_name), inputs.quality_gate, inputs.quality_gate_timeout,
                inputs.organization != '' && format(',"sonar.organization":{0}', toJSON(inputs.organization)) || '') }}
        with:
          projectBaseDir: ${{ inputs.working_directory }}
          args: ${{ inputs.extra_args }}
